<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção de Materia</title>
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 id="tituloMateria">Escolha uma Matéria:</h1>
    <section class="painelMateria">
        <button data-materia="proposicao" class="botaoMateria">
            Proposição
        </button>
        <button data-materia="tabelaVerdade" class="botaoMateria">
            Tabela Verdade
        </button>
        <button data-materia="conjuntos" class="botaoMateria">
            Conjuntos
        </button>
        <button data-materia="planoCartesiano" class="botaoMateria">
            Plano/Produto Cartesiano
        </button>
      <!-- Marcando final de  coluna -->
        <button data-materia="relacaoBinaria" class="botaoMateria">
            Relação Binária
        </button>
        <button data-materia="funcoes" class="botaoMateria">
            Funções
        </button>
        <button data-materia="equacaoReta" class="botaoMateria">
            Equação de uma Reta
        </button>
        <script src="src/javascript/escolhaMateria.js"></script>
    </section>
  </body>
</html>
