<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Mr. Plutônio</title>
    <link rel="stylesheet" href="src/styles/reset.css" />

    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Tiny5&display=swap"
        rel="stylesheet"
    />
</head>
<body id="bodyPersona">
    <div>
        <audio id="audio" preload="metadata" loop>
            <source src="src/music/Ledger of Thorns.mp3" type="audio/mp3">
        </audio>
    
        <button id="botaoAudio">
            <img 
            id="iconMute"
            src="src/img/opcoes audio/Audio3.png">
        </button>
    </div>

    <header>
        <h1 id="tituloMateria"></h1>
    </header>

    <section id="telaPrincipal">
        <div id="janelaPersona">
            <figure id="imagemfundo">
                <img src="./src/img/cenário mister plutonio.gif" alt="cenario2">
            </figure>
                
            <figure id="mrplutonio">
                <img src="./src/img/mrplutonio.gif" alt="mrplutonio">
            </figure>
        </div>

        <div id="caixadialogo">
            <p id="falaPersona"></p>
            <div id="espaçoBotao">
                <button id="bt1" class="botaousuario">(Começar)</button>
                <button  id="bt2" class="botaousuario">Reiniciar</button>
            </div>
        </div>
    </section>
    <script src="src/javascript/musica.js"></script>
    <script src="src/javascript/dialogo.js"></script>
</body>
</html>
