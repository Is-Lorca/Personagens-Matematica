<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Dra. Peixoto</title>
    <link rel="stylesheet" href="src/styles/reset.css" />

    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <body id="bodyPersona">
    <header>
      <h1 id="tituloMateria"></h1>
    </header>
    <section id="telaPrincipal">
      <div id="janelaPersona">
        <figure id="imagemfundo">
          <img src="src/img/cenário dra peixoto.gif" alt="cenario" />
        </figure>
        <figure id="drapeixoto">
          <img src="src/img/dragatinha.gif" alt="drapeixoto" />
        </figure>
      </div>

      <div id="caixadialogo">
        <p id="falaPersona"></p>
        <div id="espaçoBotao">
          <button id="bt1" class="botaousuario">(Começar)</button>
          <button id="bt2" class="botaousuario">Reiniciar</button>
        </div>
      </div>
    </section>
    <script src="src/javascript/dialogo.js"></script>
  </body>
</html>
